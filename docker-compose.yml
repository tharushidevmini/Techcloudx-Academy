services:
  # ============================================================================
  # PostgreSQL 16 Relational Database Engine
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: techcloudx-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-techcloudx_academy}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-techcloudx_academy}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - techcloudx-network

  # ============================================================================
  # Node.js Express (TypeScript) Backend Microservice
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: techcloudx-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - BACKEND_PORT=${BACKEND_PORT:-8000}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-techcloudx_academy}}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-generate_a_super_secret_64_character_hex_key_here_for_security}
      - ACCESS_TOKEN_EXPIRE_MINUTES=${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - techcloudx-network

  # ============================================================================
  # React (Vite) + Tailwind CSS Frontend Web Application
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: techcloudx-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend
    networks:
      - techcloudx-network

# ==============================================================================
# Persistent Named Volumes & Networks
# ==============================================================================
volumes:
  pgdata:
    driver: local

networks:
  techcloudx-network:
    driver: bridge
