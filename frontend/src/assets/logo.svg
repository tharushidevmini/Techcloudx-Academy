<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="capGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
  </defs>

  <!-- Modern Icon Container: Graduation Cap Over Cloud -->
  <g transform="translate(10, 8)">
    <!-- Cloud Base Body -->
    <path d="M16 46c-5.5 0-10-4.5-10-10 0-4.8 3.5-8.9 8.2-9.8 1.4-7.8 7.8-13.2 15.8-13.2 5.5 0 10.3 2.9 13 7.2 1.4-.5 3-.8 4.8-.8 6.6 0 12 5.4 12 12 0 6.6-5.4 12-12 12H16z" fill="url(#cloudGrad)" opacity="0.95" />
    <!-- Stylized Cloud Tech X Accent -->
    <path d="M26 33l8 8M34 33l-8 8" stroke="#ffffff" stroke-width="3" stroke-linecap="round" />
    <!-- Graduation Cap Perched Over Cloud -->
    <polygon points="30,4 48,12 30,20 12,12" fill="#090d16" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />
    <path d="M18,16v5c0 3.5 5.4 6 12 6s12-2.5 12-6v-5" fill="#090d16" stroke="#ffffff" stroke-width="1.8" />
    <path d="M40,15v8" stroke="url(#capGold)" stroke-width="2" stroke-linecap="round" />
    <circle cx="40" cy="24" r="2" fill="#fbbf24" />
  </g>

  <!-- Brand Typography -->
  <text x="84" y="40" font-family="'Outfit', 'Inter', sans-serif" font-weight="800" font-size="26" fill="#0284c7">
    TechCloud<tspan fill="#38bdf8">X</tspan>
  </text>
  <text x="86" y="58" font-family="'Inter', sans-serif" font-weight="700" font-size="11" letter-spacing="4" fill="#64748b">
    ACADEMY
  </text>
</svg>
